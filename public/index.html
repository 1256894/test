<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appel Audio Sélectif</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .status { padding: 12px; border-radius: 8px; background: #f3f4f6; margin-bottom: 16px; }
    .link-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Salon Audio</h1>
  <div id="status" class="status">Initialisation du microphone...</div>

  <div class="link-box">
    <input id="shareLink" type="text" readonly />
    <button id="copyBtn" type="button">Copier le lien</button>
  </div>

  <div id="audioContainer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let roomId = params.get('room');
    if (!roomId) {
      roomId = crypto.randomUUID().slice(0, 8);
      params.set('room', roomId);
      const newUrl = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, '', newUrl);
    }

    const shareInput = document.getElementById('shareLink');
    shareInput.value = window.location.href;
    document.getElementById('copyBtn').onclick = () => {
      navigator.clipboard.writeText(shareInput.value);
    };

    const statusEl = document.getElementById('status');
    const audioContainer = document.getElementById('audioContainer');
    const socket = io();

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    let localStream = null;
    let myRole = { isHost: false, hostId: null };
    const peerConnections = new Map(); // peerId -> RTCPeerConnection

    function setStatus(text) { statusEl.textContent = text; }

    function attachAudioStream(peerId, stream) {
      const shouldHear = myRole.isHost || peerId === myRole.hostId;
      if (!shouldHear) return;
      let audioEl = document.getElementById(`audio-${peerId}`);
      if (!audioEl) {
        audioEl = document.createElement('audio');
        audioEl.id = `audio-${peerId}`;
        audioEl.autoplay = true;
        audioEl.controls = false;
        audioContainer.appendChild(audioEl);
      }
      audioEl.srcObject = stream;
      audioEl.play().catch(() => {});
    }

    function removeAudioStream(peerId) {
      const audioEl = document.getElementById(`audio-${peerId}`);
      if (audioEl) audioEl.remove();
    }

    function createPeerConnection(peerId, isInitiator) {
      if (peerConnections.has(peerId)) return peerConnections.get(peerId);
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections.set(peerId, pc);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      pc.ontrack = (event) => {
        const [remoteStream] = event.streams;
        if (remoteStream) attachAudioStream(peerId, remoteStream);
      };
      pc.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { to: peerId, candidate: e.candidate });
      };
      pc.onconnectionstatechange = () => {
        if (['disconnected','failed','closed'].includes(pc.connectionState)) {
          pc.close();
          peerConnections.delete(peerId);
          removeAudioStream(peerId);
        }
      };
      if (isInitiator) {
        pc.createOffer()
          .then(offer => pc.setLocalDescription(offer))
          .then(() => socket.emit('webrtc-offer', { to: peerId, offer: pc.localDescription }));
      }
      return pc;
    }

    async function start() {
      try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); }
      catch (err) { setStatus('Erreur : accès au microphone refusé ou indisponible.'); return; }
      socket.emit('join-room', { roomId });
    }

    socket.on('room-role', ({ isHost, hostId, peerIds }) => {
      myRole = { isHost, hostId };
      setStatus(isHost ? 'Connecté : vous êtes le 1er arrivé, vous entendez tout le monde.' : 'Connecté : vous entendez uniquement la 1re personne à avoir rejoint.');
      peerIds.forEach(pid => createPeerConnection(pid, true));
    });

    socket.on('peer-joined', ({ peerId }) => { createPeerConnection(peerId, false); });

    socket.on('webrtc-offer', async ({ from, offer }) => {
      const pc = createPeerConnection(from, false);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc-answer', { to: from, answer: pc.localDescription });
    });

    socket.on('webrtc-answer', async ({ from, answer }) => {
      const pc = peerConnections.get(from);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('ice-candidate', async ({ from, candidate }) => {
      const pc = peerConnections.get(from);
      if (pc && candidate) try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){ console.error('Erreur ICE:', e); }
    });

    socket.on('peer-left', ({ peerId }) => {
      const pc = peerConnections.get(peerId);
      if (pc) { pc.close(); peerConnections.delete(peerId); }
      removeAudioStream(peerId);
    });

    socket.on('new-host', ({ hostId }) => { myRole.hostId = hostId; });
    socket.on('promoted-to-host', () => { myRole.isHost = true; setStatus('Connecté : vous êtes désormais entendu par tous.'); });

    start();
  </script>
</body>
</html>
