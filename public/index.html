<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Sélectif</title>
  <style>
    html, body { margin:0; height:100%; background:#fff; }
    /* No visible UI – everything runs silently */
  </style>
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ==== Configuration ====
    const params = new URLSearchParams(window.location.search);
    let roomId = params.get('room');
    if (!roomId) {
      roomId = crypto.randomUUID().slice(0,8);
      params.set('room', roomId);
      const newUrl = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({},'',newUrl);
    }

    const socket = io();
    const rtcConfig = { iceServers: [{ urls:'stun:stun.l.google.com:19302' }] };
    let localStream = null;
    let myRole = { isHost:false, hostId:null };
    const peerConnections = new Map(); // peerId -> RTCPeerConnection
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function shouldHearFrom(peerId) {
      // Host hears everyone; others hear only the host
      return myRole.isHost || peerId === myRole.hostId;
    }

    function createPeerConnection(peerId, isInitiator) {
      if (peerConnections.has(peerId)) return peerConnections.get(peerId);
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections.set(peerId, pc);

      // Attach local microphone tracks
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = event => {
        const [remoteStream] = event.streams;
        if (!remoteStream) return;
        if (!shouldHearFrom(peerId)) return; // ignore streams we shouldn't hear
        try {
          const source = audioCtx.createMediaStreamSource(remoteStream);
          source.connect(audioCtx.destination);
        } catch (e) {
          console.error('Audio playback error', e);
        }
      };

      pc.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { to: peerId, candidate: e.candidate });
      };

      pc.onconnectionstatechange = () => {
        if (['disconnected','failed','closed'].includes(pc.connectionState)) {
          pc.close();
          peerConnections.delete(peerId);
        }
      };

      if (isInitiator) {
        pc.createOffer()
          .then(o => pc.setLocalDescription(o))
          .then(() => socket.emit('webrtc-offer', { to: peerId, offer: pc.localDescription }));
      }
      return pc;
    }

    async function start() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
        // Resume AudioContext after user interaction (mic permission counts)
        await audioCtx.resume();
      } catch (e) {
        console.error('Microphone access denied', e);
        return;
      }
      socket.emit('join-room', { roomId });
    }

    // ---- Socket signalling ----
    socket.on('room-role', ({ isHost, hostId, peerIds }) => {
      myRole = { isHost, hostId };

      if (myRole.isHost) {
        // Host: connect to every existing peer as initiator
        peerIds.forEach(pid => createPeerConnection(pid, true));
      } else {
        // Non‑host: connect only to the current host (if known)
        if (myRole.hostId) createPeerConnection(myRole.hostId, true);
      }
    });

    // New peer joined the room
    socket.on('peer-joined', ({ peerId }) => {
      if (myRole.isHost) {
        // Host should initiate connection to the new peer
        createPeerConnection(peerId, true);
      }
      // Non‑host does nothing – they only talk to the host
    });

    socket.on('webrtc-offer', async ({ from, offer }) => {
      const pc = createPeerConnection(from, false);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc-answer', { to: from, answer: pc.localDescription });
    });

    socket.on('webrtc-answer', async ({ from, answer }) => {
      const pc = peerConnections.get(from);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('ice-candidate', async ({ from, candidate }) => {
      const pc = peerConnections.get(from);
      if (pc && candidate) {
        try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); }
        catch(e){ console.error('ICE error', e); }
      }
    });

    socket.on('peer-left', ({ peerId }) => {
      const pc = peerConnections.get(peerId);
      if (pc) { pc.close(); peerConnections.delete(peerId); }
    });

    socket.on('new-host', ({ hostId }) => {
      myRole.hostId = hostId;
      // If we are not host yet, ensure we have a connection to the new host
      if (!myRole.isHost && hostId) {
        if (!peerConnections.has(hostId)) createPeerConnection(hostId, true);
      }
    });

    socket.on('promoted-to-host', () => {
      myRole.isHost = true;
      // As new host, connect to all existing peers (excluding self)
      // The server keeps the list of peers in room.peers; we request it via socket?
      // Simplify: after promotion, we will receive a new 'peer-joined' for each existing peer automatically when they re‑connect.
    });

    // Auto‑start when page loads
    start();
  </script>
</body>
</html>
